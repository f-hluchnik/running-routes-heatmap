<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running routes heatmap</title>
<style>
<!--@styles-->
</style>
</head>
<body>
<div id="map"></div>

<aside id="panel" aria-label="Map controls">
  <header>
    <h1>Running routes</h1>
    <p id="summary"></p>
  </header>

  <fieldset class="segmented" id="views">
    <legend>View</legend>
  </fieldset>

  <details id="run-filter" open>
    <summary>Runs <span id="run-count"></span></summary>
    <div class="date-range" id="date-range">
      <label>From <input type="date" id="date-from"></label>
      <label>To <input type="date" id="date-to"></label>
    </div>
    <div class="list-actions">
      <button type="button" class="link" id="runs-all">All</button>
      <button type="button" class="link" id="runs-none">None</button>
    </div>
    <ul id="run-list"></ul>
  </details>

  <label class="switch">
    <input type="checkbox" id="basemap">
    <span>OpenStreetMap basemap</span>
  </label>

  <label class="slider">
    <span>Line width</span>
    <input type="range" id="width" min="1" max="8" step="0.5">
  </label>
  <label class="slider" id="opacity-row">
    <span>Opacity</span>
    <input type="range" id="opacity" min="0.1" max="0.8" step="0.05">
  </label>

  <div>
    <button type="button" id="export">Export PNG</button>
    <p id="status" role="status"></p>
  </div>
</aside>

<aside id="legend" aria-label="Frequency legend" hidden>
  <span class="legend-title">Runs per street</span>
  <div class="legend-bar" id="legend-bar"></div>
  <div class="legend-labels"><span>1</span><span id="legend-max"></span></div>
</aside>

<script id="heatmap-data" type="application/json"><!--@data--></script>
<!--@scripts-->
</body>
</html>
